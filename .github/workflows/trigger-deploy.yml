name: Trigger Deployment

on:
  push:
    branches:
      - main
      - master
  repository_dispatch:
    types:
      - definition_update
      - firmware_update
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Trigger deploy hook

    steps:
      - name: Send request to trigger deploy hook
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
